name: Build release artifacts

# Runs when a GitHub Release is published, builds the SMAPI mod zip and the
# companion app's Android APK, and attaches both to that release.
#
# One-time setup required (see mod/README.md#ci-builds for details):
#   - STARDEW_REFASM_B64_000..081  (required) 82 chunked secrets holding a
#     gzipped+base64'd tarball of the Stardew Valley / SMAPI DLLs the mod
#     needs to compile against, with method bodies stripped (mod/ci-tools/).
#     Regenerate with mod/ci-tools/generate-ci-secrets.sh when the game/SMAPI
#     version changes. Split across small groups of secrets per workflow
#     step - see the "Append game reference assembly payload chunk" steps.
#   - SUBMODULES_TOKEN             (only if the mod/companion repos are private)
#     a PAT with repo read access, so actions/checkout can fetch the submodules.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mod:
    name: Build mod zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Init game reference assembly payload
        run: |
          mkdir -p "$RUNNER_TEMP/refasm"
          : > "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 1/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_000 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_001 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_002 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_003 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_004 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_005 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 2/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_006 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_007 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_008 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_009 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_010 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_011 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 3/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_012 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_013 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_014 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_015 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_016 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_017 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 4/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_018 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_019 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_020 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_021 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_022 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_023 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 5/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_024 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_025 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_026 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_027 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_028 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_029 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 6/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_030 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_031 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_032 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_033 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_034 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_035 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 7/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_036 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_037 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_038 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_039 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_040 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_041 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 8/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_042 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_043 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_044 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_045 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_046 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_047 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 9/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_048 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_049 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_050 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_051 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_052 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_053 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 10/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_054 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_055 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_056 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_057 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_058 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_059 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 11/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_060 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_061 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_062 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_063 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_064 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_065 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 12/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_066 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_067 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_068 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_069 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_070 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_071 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 13/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_072 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_073 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_074 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_075 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_076 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_077 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Append game reference assembly payload chunk 14/14
        # Small groups of secrets per step - GitHub Actions' workflow template
        # evaluator has an undocumented total-size limit per step ("Maximum
        # object size exceeded") that a single step referencing all 82 secrets
        # at once hit. See mod/README.md#ci-builds.
        run: |
          {
            printf %s "${{ secrets.STARDEW_REFASM_B64_078 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_079 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_080 }}"
            printf %s "${{ secrets.STARDEW_REFASM_B64_081 }}"
          } >> "$RUNNER_TEMP/refasm/payload.b64"

      - name: Extract game reference assemblies
        run: |
          if [ ! -s "$RUNNER_TEMP/refasm/payload.b64" ]; then
            echo "::error::STARDEW_REFASM_B64_* secrets are not set. See mod/README.md#ci-builds for how to generate them."
            exit 1
          fi
          base64 -d "$RUNNER_TEMP/refasm/payload.b64" > "$RUNNER_TEMP/refasm/stardew-game-assemblies.tar.gz"
          mkdir -p "$RUNNER_TEMP/stardew-game"
          tar -xzf "$RUNNER_TEMP/refasm/stardew-game-assemblies.tar.gz" -C "$RUNNER_TEMP/stardew-game"
          echo "GAME_PATH=$RUNNER_TEMP/stardew-game" >> "$GITHUB_ENV"

      - name: Build mod (produces the release zip via ModBuildConfig)
        run: dotnet build mod/StardewDS.csproj -c Release "/p:GamePath=${{ env.GAME_PATH }}"

      - name: Locate built zip
        id: modzip
        run: |
          zip_path=$(ls mod/bin/Release/net6.0/*.zip | head -n1)
          if [ -z "$zip_path" ]; then
            echo "::error::No mod zip found under mod/bin/Release/net6.0/ — check EnableModZip in StardewDS.csproj."
            exit 1
          fi
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.modzip.outputs.path }}" --clobber

  build-companion:
    name: Build companion Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: companion
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p out
          cp companion/build/app/outputs/flutter-apk/app-release.apk "out/stardew-ds-companion-${{ github.event.release.tag_name }}.apk"

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "out/stardew-ds-companion-${{ github.event.release.tag_name }}.apk" --clobber
